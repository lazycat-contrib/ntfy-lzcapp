application:
  subdomain: ntfy
  background_task: true
  upstreams:
    - location: /
      backend: http://ntfy:80/
  public_path:
    - /
services:
  ntfy:
    # binwiederhier/ntfy:v2.24.0
    # upstream: docker.io/binwiederhier/ntfy:v2.30.0
    image: registry.lazycat.cloud/czyt/binwiederhier/ntfy:8156f31cfd2be210
    environment:
      - TZ={{.U.tz}}
    command: serve
    binds:
      - /lzcapp/cache/ntfy:/var/cache/ntfy
      - /lzcapp/var/ntfy:/etc/ntfy
