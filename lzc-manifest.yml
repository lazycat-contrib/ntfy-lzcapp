application:
  subdomain: ntfy
  background_task: true
  upstreams:
    - location: /
      backend: http://ntfy:80/
  public_path:
    - /
services:
  ntfy:
    # binwiederhier/ntfy:v2.24.0
    # upstream: docker.io/binwiederhier/ntfy:v2.28.0
    image: registry.lazycat.cloud/czyt/binwiederhier/ntfy:e2c0c6da2577d46a
    environment:
      - TZ={{.U.tz}}
    command: serve
    binds:
      - /lzcapp/cache/ntfy:/var/cache/ntfy
      - /lzcapp/var/ntfy:/etc/ntfy
